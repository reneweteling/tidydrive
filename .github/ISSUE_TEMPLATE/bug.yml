name: Bug report
description: Something in TidyDrive does not work as it should
labels: [bug]
body:
  - type: dropdown
    id: channel
    attributes:
      label: Which TidyDrive do you run?
      options:
        - GitHub release
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TidyDrive version
      description: Settings, About tab
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Which category?
      options:
        - Xcode
        - Simulators
        - Projects
        - Large files
        - Package caches
        - ML models
        - Language versions
        - Docker
        - Android
        - Disk warning or menu bar
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead. If an item was wrongly offered for removal, say which tool and folder it was.
    validations:
      required: true
